name: Agent State Shadow Compatibility

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - ".github/workflows/agent-state-shadow.yml"
      - "eng/shadow/**"
      - "eng/packages/**"
      - "Directory.Packages.props"
      - "src/CodexSwitcher.Core/CodexSwitcher.Core.csproj"
      - "src/CodexSwitcher.Core/Accounts/Services/AccountRegistry.cs"
      - "src/CodexSwitcher.Core/Routing/**"
      - "src/CodexSwitcher.Infra/Codex/Runtime/**"
      - "src/CodexSwitcher.Infra/Codex/Threads/CodexAppServerClient.cs"
      - "src/CodexSwitcher.Infra/CodexSwitcher.Infra.csproj"
      - "tests/CodexSwitcher.Core.Tests/CodexRuntimeCapabilityTests.cs"
      - "tests/CodexSwitcher.Core.Tests/ProductionRuntimePrecedenceRegressionTests.cs"
      - "src/CodexSwitcher.Infra/AgentState/Shadow/**"
      - "tests/CodexSwitcher.AgentStateShadow.CrossRepoTests/**"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - ".github/workflows/agent-state-shadow.yml"
      - "eng/shadow/**"
      - "eng/packages/**"
      - "Directory.Packages.props"
      - "src/CodexSwitcher.Core/CodexSwitcher.Core.csproj"
      - "src/CodexSwitcher.Core/Accounts/Services/AccountRegistry.cs"
      - "src/CodexSwitcher.Core/Routing/**"
      - "src/CodexSwitcher.Infra/Codex/Runtime/**"
      - "src/CodexSwitcher.Infra/Codex/Threads/CodexAppServerClient.cs"
      - "src/CodexSwitcher.Infra/CodexSwitcher.Infra.csproj"
      - "tests/CodexSwitcher.Core.Tests/CodexRuntimeCapabilityTests.cs"
      - "tests/CodexSwitcher.Core.Tests/ProductionRuntimePrecedenceRegressionTests.cs"
      - "src/CodexSwitcher.Infra/AgentState/Shadow/**"
      - "tests/CodexSwitcher.AgentStateShadow.CrossRepoTests/**"

permissions:
  contents: read

concurrency:
  group: agent-state-shadow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Pinned daemon real-process compatibility (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout Control Center
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Python for pinned catalog validation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify pinned daemon and real-process shadow projection
        shell: pwsh
        run: ./eng/shadow/verify-cross-repo.ps1
